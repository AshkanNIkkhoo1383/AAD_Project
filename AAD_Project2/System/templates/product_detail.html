{% load static %}
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>جزئیات کالا</title>
    <link rel="stylesheet" href="{% static 'css/product_detail.css' %}">
</head>
<body>

    <section class="wrapper">
        <h1>جزئیات کالا</h1>

        <div class="product-card">
            <!-- عکس کالا -->
            {% if product.photo %}
            <img src="{{ product.photo.url }}" alt="{{ product.name }}" class="product-photo">
            {% else %}
            <img src="{% static 'images/no-image.png' %}" alt="بدون عکس" class="product-photo">
            {% endif %}

            <!-- اطلاعات کالا -->
            <div class="product-info">
                <h2>{{ product.name }}</h2>
                <p><strong>قیمت:</strong> {{ product.price }} تومان</p>
                <p><strong>نوع کالا:</strong> {{ product.get_product_type_display }}</p>
            </div>
        </div>

        <!-- دکمه بازگشت -->
        <div class="back-link">
            <a href="{% url 'system:inventory_list' %}">بازگشت به موجودی انبار</a>
        </div>
    </section>

</body>
</html>
